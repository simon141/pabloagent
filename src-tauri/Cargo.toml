[package]
name = "pabloagent"
version = "1.0.0"
description = "Pablo Agent, chat client for Codex, Claude Code, opencode and pi over SSH"
authors = ["simon141"]
edition = "2021"
default-run = "pablo"

[[bin]]
name = "pablo"
path = "src/main.rs"

[lib]
name = "pabloagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.clippy]
all = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
russh = { version = "0.62", default-features = false, features = ["ring"] }
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
# Android foreground service JNI bridge.
jni = "0.21"
tao = "0.35"

[dev-dependencies]
tokio = { version = "1", features = ["process", "test-util"] }

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
