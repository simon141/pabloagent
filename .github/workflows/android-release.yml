name: Release builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust with the Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Point Tauri at the runner's NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PABLO_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PABLO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PABLO_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf %s "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pablo-release.jks"
          else
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/pablo-release.jks" -storetype JKS \
              -alias release -storepass ci-only -keypass ci-only \
              -keyalg RSA -keysize 4096 -validity 30 \
              -dname "CN=Pablo CI, O=Pablo, C=AU"
            KEYSTORE_PASSWORD=ci-only
            KEY_PASSWORD=ci-only
          fi
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/pablo-release.jks
          keyAlias=release
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          EOF

      - run: npm ci

      - name: Build the release APK
        run: npm run android:build
        env:
          ORG_GRADLE_PROJECT_githubApk: true

      - name: Verify the APK
        env:
          ORG_GRADLE_PROJECT_githubApk: true
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          ./scripts/verify-apk.sh "$apk"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$apk" "$RUNNER_TEMP/release-assets/pabloagent-android-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pablo-android-arm64
          path: ${{ runner.temp }}/release-assets/pabloagent-android-arm64.apk
          if-no-files-found: error
          retention-days: 14

  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            elf: x86-64
            triplet: x86_64-linux-gnu
            config: ""
          - arch: aarch64
            runner: ubuntu-22.04-arm
            elf: ARM aarch64
            triplet: aarch64-linux-gnu
            config: --config src-tauri/appimage-aarch64.conf.json

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}

      - name: Install Tauri, AppImage and package tooling
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libxdo-dev libayatana-appindicator3-dev patchelf rpm xdg-utils

      - run: npm ci

      - name: Build the AppImage, Debian and RPM packages
        run: npm run tauri build -- --bundles appimage,deb,rpm ${{ matrix.config }}

      - name: Verify and package Linux outputs
        run: |
          file src-tauri/target/release/pabloagent | grep -F 'ELF 64-bit' | grep -F '${{ matrix.elf }}'
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          appimage=$(realpath "$appimage")
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          rpm=$(find src-tauri/target/release/bundle/rpm -name '*.rpm' | head -1)
          scripts/verify-linux-packages.sh "$deb" "$rpm"
          mkdir -p "$RUNNER_TEMP/appimage-check" "$RUNNER_TEMP/release-assets"
          cd "$RUNNER_TEMP/appimage-check"
          "$appimage" --appimage-extract \
            'usr/lib/${{ matrix.triplet }}/webkit2gtk-4.1/WebKitGPUProcess'
          test -x squashfs-root/usr/lib/${{ matrix.triplet }}/webkit2gtk-4.1/WebKitGPUProcess
          asset="$RUNNER_TEMP/release-assets/pabloagent-linux-${{ matrix.arch }}"
          install -m 755 "$GITHUB_WORKSPACE/src-tauri/target/release/pabloagent" "$asset"
          install -m 755 "$appimage" "$asset.AppImage"
          install -m 644 "$GITHUB_WORKSPACE/$deb" "$asset.deb"
          install -m 644 "$GITHUB_WORKSPACE/$rpm" "$asset.rpm"

      - name: Install the packages in clean containers
        run: |
          docker run --rm -e DEBIAN_FRONTEND=noninteractive \
            -v "$RUNNER_TEMP/release-assets:/pkgs:ro" debian:bookworm bash -euxc '
            apt-get update -qq
            apt-get install -y -qq /pkgs/pabloagent-linux-${{ matrix.arch }}.deb
            dpkg -s pablo-agent | grep -F "Status: install ok installed"
            if ldd /usr/bin/pabloagent | grep -F "not found"; then exit 1; fi'
          docker run --rm -v "$RUNNER_TEMP/release-assets:/pkgs:ro" fedora:latest bash -euxc '
            dnf install -y -q /pkgs/pabloagent-linux-${{ matrix.arch }}.rpm
            rpm -q pablo-agent
            if ldd /usr/bin/pabloagent | grep -F "not found"; then exit 1; fi'

      - uses: actions/upload-artifact@v4
        with:
          name: pablo-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/release-assets/pabloagent-linux-${{ matrix.arch }}
            ${{ runner.temp }}/release-assets/pabloagent-linux-${{ matrix.arch }}.AppImage
            ${{ runner.temp }}/release-assets/pabloagent-linux-${{ matrix.arch }}.deb
            ${{ runner.temp }}/release-assets/pabloagent-linux-${{ matrix.arch }}.rpm
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust with both Apple targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: universal-apple-darwin

      - name: Configure code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || continue
            { echo "$name<<PABLO_EOF"; echo "${!name}"; echo "PABLO_EOF"; } >> "$GITHUB_ENV"
          done

      - run: npm ci

      - name: Build the universal app and disk image
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Verify and package the macOS outputs
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -1)
          dmg=$(find "$bundle/dmg" -name '*.dmg' | head -1)
          test -n "$app"
          test -n "$dmg"
          archs=$(lipo -archs "$app/Contents/MacOS/pabloagent")
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "Expected a universal binary, got: $archs"; exit 1 ;;
          esac
          codesign --verify --deep --strict "$app"
          hdiutil imageinfo "$dmg" > /dev/null
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$dmg" "$RUNNER_TEMP/release-assets/pabloagent-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: pablo-macos-universal
          path: ${{ runner.temp }}/release-assets/pabloagent-macos-universal.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install the Windows cross-compilation toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc
          cargo install --locked cargo-xwin
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc

      - name: Install the cross linker and NSIS
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm nsis

      - run: npm ci

      - name: Cross-compile the Windows executable and NSIS installer
        run: npm run tauri build -- --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis

      - name: Verify and package the Windows outputs
        run: |
          executable=src-tauri/target/x86_64-pc-windows-msvc/release/pabloagent.exe
          installer=$(find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name '*-setup.exe' | head -1)
          test -n "$installer"
          file "$executable" | grep -F 'PE32+ executable'
          file "$installer" | grep -F 'PE32 executable'
          grep -q -a -F NullsoftInst "$installer"
          grep -q -a -F __TAURI_BUNDLE_TYPE_VAR_UNK "$executable"
          7z e -so "$installer" pabloagent.exe | grep -q -a -F __TAURI_BUNDLE_TYPE_VAR_NSS
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$executable" "$RUNNER_TEMP/release-assets/pabloagent-windows-portable.exe"
          cp "$installer" "$RUNNER_TEMP/release-assets/pabloagent-windows-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: pablo-windows-x86_64
          path: |
            ${{ runner.temp }}/release-assets/pabloagent-windows-portable.exe
            ${{ runner.temp }}/release-assets/pabloagent-windows-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    needs: [checks, android, linux, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate the release tag version
        if: github.ref_type == 'tag'
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json')).version")"

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release="$GITHUB_REF_NAME"
            if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$release" --repo "$GITHUB_REPOSITORY" --title "$release"
            else
              gh release create "$release" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --title "$release" --generate-notes
            fi
          else
            release=continuous
            if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/git/refs/tags/$release" \
                -f sha="$GITHUB_SHA" -F force=true
              gh release edit "$release" --repo "$GITHUB_REPOSITORY" \
                --prerelease --title "Continuous build" \
                --notes "Build artifacts from main ($GITHUB_SHA)."
            else
              gh release create "$release" --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" --prerelease --title "Continuous build" \
                --notes "Build artifacts from main ($GITHUB_SHA)."
            fi
          fi
          gh release upload "$release" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
